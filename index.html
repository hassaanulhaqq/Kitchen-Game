<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ننھے شیف - لائیو کوکنگ گیم</title>
    <!-- Phaser 3 فریم ورک CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #05050a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            border: 5px solid #ffaa00;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(255, 170, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- خالص گیم کینوس ہولڈر -->
    <div id="game-container"></div>

    <script>
        class CookingGameScene extends Phaser.Scene {
            constructor() {
                super('CookingGameScene');
            }

            create() {
                // 1. کینوس کا پس منظر (گیم کا اپنا ماحول)
                this.add.rectangle(640, 360, 1280, 720, 0x111827);

                // 2. کچن کاؤنٹر (کینوس گرافکس)
                this.add.rectangle(640, 580, 1200, 240, 0x1f2937).setStrokeStyle(4, 0x374151);
                this.add.rectangle(640, 460, 1200, 12, 0xf59e0b);

                // 3. گیم کا ٹاپ ہیڈر اور اسکور
                this.add.text(640, 45, '🍳 ننھے شیف - لائیو کچن سمیولیشن 🍲', {
                    fontSize: '32px',
                    fill: '#f59e0b',
                    fontStyle: 'bold',
                    fontFamily: 'Segoe UI'
                }).setOrigin(0.5);

                this.score = 40;
                this.scoreText = this.add.text(1150, 45, 'اسکور: ' + this.score, {
                    fontSize: '24px',
                    fill: '#ffffff',
                    backgroundColor: '#d97706',
                    padding: { x: 12, y: 6 }
                }).setOrigin(0.5);

                // 4. گیم کے اندر ہی گرافیکل ڈائیلاگ باکس (وائس اوور بار)
                this.add.rectangle(640, 120, 900, 60, 0xffffff, 0.95).setStrokeStyle(3, 0xf59e0b);
                this.instructionText = this.add.text(640, 120, 'بہت زبردست! تمام اجزاء مکس ہو گئے ہیں۔ اب چولہا جلائیں۔', {
                    fontSize: '22px',
                    fill: '#1f2937',
                    fontStyle: 'bold'
                }).setOrigin(0.5);

                // 5. مکسنگ پیالہ اور چولہا (گیم ابجیکٹس)
                let bowl = this.add.text(350, 520, '🥣 پیالہ', { 
                    fontSize: '28px', fill: '#ffffff', backgroundColor: '#3b82f6', padding: { x: 20, y: 12 } 
                }).setOrigin(0.5).setInteractive();

                let stove = this.add.text(930, 520, '🔥 چولہا (Stove)', { 
                    fontSize: '28px', fill: '#ffffff', backgroundColor: '#ef4444', padding: { x: 20, y: 12 } 
                }).setOrigin(0.5).setInteractive();

                // 6. شیلف کے اجزاء
                this.createIngredient(300, 250, '🌾', 'میدہ');
                this.createIngredient(500, 250, '🥚', 'انڈا');
                this.createIngredient(700, 250, '🥛', 'دودھ');
                this.createIngredient(900, 250, '🍯', 'شہد');

                // باؤل یا چولہے پر کلک کرنے پر ایکشن
                stove.on('pointerdown', () => {
                    this.score += 25;
                    this.scoreText.setText('اسکور: ' + this.score);
                    this.instructionText.setText('مَا شَاءَ اللّٰه! گرما گرم پین کیک تیار ہو چکا ہے!');
                    this.speakVoice("مَا شَاءَ اللّٰه! پین کیک تیار ہو گیا ہے!", true);
                });
            }

            createIngredient(x, y, emoji, name) {
                let item = this.add.text(x, y, emoji, { fontSize: '55px' }).setOrigin(0.5).setInteractive();
                
                // فزکس اور ڈریگ سسٹم
                this.input.setDraggable(item);

                this.input.on('drag', (pointer, gameObject, dragX, dragY) => {
                    gameObject.x = dragX;
                    gameObject.y = dragY;
                });

                item.on('pointerdown', () => {
                    this.instructionText.setText(`آپ نے ${name} اٹھا لیا ہے!`);
                    this.speakVoice(`${name} اٹھا لیا ہے۔`);
                });
            }

            speakVoice(text, isArabic = false) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    let utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = isArabic ? 'ar-SA' : 'ur-PK';
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                }
            }
        }

        const config = {
            type: Phaser.AUTO,
            width: 1280,
            height: 720,
            parent: 'game-container',
            backgroundColor: '#05050a',
            scene: [CookingGameScene]
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
