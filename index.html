<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ننھے شیف - لائیو کینوس گیم</title>
    <!-- Phaser 3 گیم انجن CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #090d16;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        #game-canvas-container {
            border: 6px solid #f59e0b;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- یہاں اصل گیم کا کینوس رینڈر ہوگا -->
    <div id="game-canvas-container"></div>

    <script>
        class MainGameScene extends Phaser.Scene {
            constructor() {
                super('MainGameScene');
            }

            preload() {
                // یہاں گیم کے گرافکس اور اثاثے لوڈ ہوتے ہیں
            }

            create() {
                // 1. کینوس پر کچن کا لائیو پس منظر (WebGL / Canvas Background)
                this.add.rectangle(640, 360, 1280, 720, 0x1e293b);

                // کاؤنٹر ٹاپ کی لکیر
                this.add.rectangle(640, 550, 1280, 340, 0x334155);
                this.add.rectangle(640, 390, 1280, 20, 0xf59e0b);

                // 2. ٹاپ ہیڈر اور اسکور بورڈ
                this.add.text(640, 50, '🍳 ننھے شیف - فُل کینوس سمولیشن گیم 🍲', {
                    fontSize: '36px',
                    fill: '#f59e0b',
                    fontStyle: 'bold'
                }).setOrigin(0.5);

                this.scoreText = this.add.text(1150, 50, 'اسکور: 0', {
                    fontSize: '28px',
                    fill: '#ffffff',
                    backgroundColor: '#d97706',
                    padding: { x: 15, y: 8 }
                }).setOrigin(0.5);

                // 3. وائس اوور / ڈائیلاگ باکس (گیم کے اندر رینڈر شدہ گرافیکل باکس)
                this.add.rectangle(640, 130, 950, 60, 0xffffff, 0.95).setStrokeStyle(4, 0xf59e0b);
                
                this.dialogueText = this.add.text(640, 130, 'السَّلَامُ عَلَيْكُمْ دوستو! آج مزیدار پین کیک بنے گا، مَا شَاءَ اللّٰه!', {
                    fontSize: '24px',
                    fill: '#0f172a',
                    fontStyle: 'bold'
                }).setOrigin(0.5);

                // سلام عربی لہجے میں پلے کرنا
                this.playVoice("السَّلَامُ عَلَيْكُمْ دوستو! آج مزیدار پین کیک بنے گا، مَا شَاءَ اللّٰه!", true);

                // 4. گیم کے مرکزی اسٹیشنز (مکسنگ پیالہ اور چولہا)
                let bowl = this.add.text(400, 480, '🥣', { fontSize: '80px' }).setOrigin(0.5).setInteractive();
                this.add.text(400, 550, 'مکسنگ پیالہ', { fontSize: '20px', fill: '#38bdf8' }).setOrigin(0.5);

                let stove = this.add.text(880, 480, '🔥', { fontSize: '80px' }).setOrigin(0.5).setInteractive();
                this.add.text(880, 550, 'چولہا (Stove)', { fontSize: '20px', fill: '#f43f5e' }).setOrigin(0.5);

                // 5. شیلف پر اجزاء (میدہ، انڈا، دودھ، شہد)
                let flour = this.createItem(250, 250, '🌾', 'میدہ');
                let egg = this.createItem(450, 250, '🥚', 'انڈا');
                let milk = this.createItem(650, 250, '🥛', 'دودھ');
                let honey = this.createItem(850, 250, '🍯', 'شہد');

                // اسکور کی ویری ایبل
                this.score = 0;

                // مکسنگ باؤل پر کلک کرنے کی منطق
                bowl.on('pointerdown', () => {
                    this.score += 15;
                    this.scoreText.setText('اسکور: ' + this.score);
                    this.dialogueText.setText('بہت زبردست! تمام اجزاء مکس ہو گئے ہیں۔ اب چولہا جلائیں۔');
                    this.playVoice("بہت زبردست! اجزاء مکس ہو گئے ہیں۔");
                });

                // چولہے پر کلک کرنے کی منطق
                stove.on('pointerdown', () => {
                    this.score += 25;
                    this.scoreText.setText('اسکور: ' + this.score);
                    this.dialogueText.setText('مَا شَاءَ اللّٰه! گرما گرم پین کیک تیار ہو چکا ہے!');
                    this.playVoice("مَا شَاءَ اللّٰه! پین کیک تیار ہو گیا ہے!", true);
                });
            }

            createItem(x, y, emoji, name) {
                let item = this.add.text(x, y, emoji, { fontSize: '50px' }).setOrigin(0.5).setInteractive();
                
                // کینوس پر ڈریگ اینڈ ڈراپ کا بلٹ ان فزکس فلو
                this.input.setDraggable(item);

                this.input.on('drag', (pointer, gameObject, dragX, dragY) => {
                    gameObject.x = dragX;
                    gameObject.y = dragY;
                });

                item.on('pointerdown', () => {
                    this.dialogueText.setText(`آپ نے ${name} منتخب کیا ہے! اسے پیالے میں ڈالیں۔`);
                    this.playVoice(`${name} اٹھا لیا ہے، اب پیالے میں ڈالیں۔`);
                });

                return item;
            }

            playVoice(text, isArabic = false) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    let utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = isArabic ? 'ar-SA' : 'ur-PK';
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                }
            }
        }

        // Phaser گیم کی کنفیگریشن (خالص کینوس موڈ)
        const config = {
            type: Phaser.AUTO,
            width: 1280,
            height: 720,
            parent: 'game-canvas-container',
            backgroundColor: '#0f172a',
            scene: [MainGameScene]
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
