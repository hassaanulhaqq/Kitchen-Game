<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ننھے شیف - لائیو سمیولیشن گیم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* گیم کا مین کنٹینر (WebGL ونڈو فریم) */
        .game-viewport {
            position: relative;
            width: 1000px;
            height: 600px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 6px solid #f59e0b;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
        }
        /* ٹاپ ہیڈر */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            padding: 10px 20px;
            border-radius: 12px;
            border-bottom: 2px solid #f59e0b;
        }
        .game-title {
            font-size: 1.5rem;
            color: #f59e0b;
            font-weight: bold;
        }
        .score-box {
            background: #d97706;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        /* ڈائیلاگ اور وائس اوور بار */
        .voice-bar {
            background: #ffffff;
            color: #1e293b;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        /* کچن گراؤنڈ */
        .kitchen-stage {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 320px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 2px dashed rgba(255,255,255,0.2);
        }
        /* شیلف اور اسٹیشنز */
        .shelf-container {
            display: flex;
            gap: 15px;
            background: #b45309;
            padding: 10px 20px;
            border-radius: 15px;
            border-bottom: 4px solid #78350f;
        }
        .item-card {
            background: #fff;
            color: #000;
            width: 70px;
            height: 70px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            cursor: grab;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .item-card:hover {
            transform: scale(1.1);
        }
        .workstation {
            width: 220px;
            height: 200px;
            background: #334155;
            border: 4px solid #38bdf8;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }
        .workstation:hover {
            border-color: #f59e0b;
        }
        .workstation span {
            font-size: 4rem;
        }
        .workstation label {
            margin-top: 10px;
            font-weight: bold;
            color: #38bdf8;
        }
        /* کنٹرول بار */
        .footer-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .action-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        .action-btn:hover {
            background: #059669;
        }
    </style>
</head>
<body>

    <div class="game-viewport">
        <!-- ہیڈر -->
        <div class="game-header">
            <div class="game-title">🍳 ننھے شیف - لائیو کچن سمیولیشن</div>
            <div class="score-box" id="scoreDisplay">اسکور: 0</div>
        </div>

        <!-- وائس اوور باکس (کلک کرنے پر دوبارہ آواز چلے گی) -->
        <div class="voice-bar" onclick="replayVoice()">
            🔊 <span id="voiceText">السَّلَامُ عَلَيْكُمْ دوستو! آج مزیدار پین کیک بنے گا، مَا شَاءَ اللّٰه!</span>
        </div>

        <!-- کچن کا اسٹیج -->
        <div class="kitchen-stage">
            <!-- اجزاء کی شیلف -->
            <div class="shelf-container">
                <div class="item-card" onclick="pickItem('🌾', 'میدہ')">🌾</div>
                <div class="item-card" onclick="pickItem('🥚', 'انڈا')">🥚</div>
                <div class="item-card" onclick="pickItem('🥛', 'دودھ')">🥛</div>
                <div class="item-card" onclick="pickItem('🍯', 'شہد')">🍯</div>
            </div>

            <!-- مکسنگ اور کوکنگ اسٹیشن -->
            <div class="workstation" onclick="useBowl()" id="bowlStation">
                <span id="bowlEmoji">🥣</span>
                <label>مکسنگ پیالہ</label>
            </div>

            <div class="workstation" onclick="useStove()" id="stoveStation" style="border-color: #f43f5e;">
                <span id="stoveEmoji">🔥</span>
                <label style="color: #f43f5e;">چولہا (Stove)</label>
            </div>
        </div>

        <!-- فوٹر کنٹرولز -->
        <div class="footer-controls">
            <button class="action-btn" onclick="resetKitchen()">دوبارہ شروع کریں 🔄</button>
            <button class="action-btn" style="background: #6366f1;" onclick="nextStep()">اگلا مرحلہ ➡️</button>
        </div>
    </div>

    <script>
        let score = 0;
        let activeItem = null;
        let currentDialogue = "السَّلَامُ عَلَيْكُمْ دوستو! آج مزیدار پین کیک بنے گا، مَا شَاءَ اللّٰه!";

        // بہتر اور معیاری آڈیو سنتھیسس (عربی اور اردو درست تلفظ کے ساتھ)
        function speak(text, isArabic = false) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                
                // عربی اور اردو کے لیے درست زبان کا ٹیگ
                utterance.lang = isArabic ? 'ar-SA' : 'ur-PK';
                utterance.rate = 0.85; // ہلکی رفتار تاکہ بچوں کو سمجھ آئے
                utterance.pitch = 1.1;  // دوستانہ اور خوشگوار آواز
                
                window.speechSynthesis.speak(utterance);
            }
        }

        function replayVoice() {
            speak(currentDialogue, currentDialogue.includes('مَا شَاءَ اللّٰه'));
        }

        function pickItem(emoji, name) {
            activeItem = emoji;
            currentDialogue = `آپ نے ${name} اٹھا لیا ہے! اب اسے مکسنگ پیالے میں ڈالیں۔`;
            document.getElementById("voiceText").innerText = currentDialogue;
            speak(currentDialogue);
        }

        function useBowl() {
            if (activeItem) {
                document.getElementById("bowlEmoji").innerText = activeItem;
                score += 15;
                document.getElementById("scoreDisplay").innerText = "اسکور: " + score;
                currentDialogue = "بہت زبردست! تمام اجزاء مکس ہو گئے ہیں۔ اب چولہا جلائیں۔";
                document.getElementById("voiceText").innerText = currentDialogue;
                speak("بہت زبردست! اجزاء مکس ہو گئے ہیں۔");
                activeItem = null;
            } else {
                currentDialogue = "پہلے شیلف سے کوئی جز (میدہ یا انڈا) منتخب کریں۔";
                document.getElementById("voiceText").innerText = currentDialogue;
                speak("پہلے شیلف سے کوئی جز منتخب کریں۔");
            }
        }

        function useStove() {
            score += 25;
            document.getElementById("scoreDisplay").innerText = "اسکور: " + score;
            currentDialogue = "مَا شَاءَ اللّٰه! گرما گرم پین کیک تیار ہو چکا ہے! یمی!";
            document.getElementById("voiceText").innerText = currentDialogue;
            speak("مَا شَاءَ اللّٰه! پین کیک تیار ہو گیا ہے!", true);
        }

        function nextStep() {
            currentDialogue = "اگلا مرحلہ: اب اس پر شہد ڈالیں!";
            document.getElementById("voiceText").innerText = currentDialogue;
            speak("اگلا مرحلہ شروع کرتے ہیں!");
        }

        function resetKitchen() {
            score = 0;
            activeItem = null;
            document.getElementById("scoreDisplay").innerText = "اسکور: 0";
            document.getElementById("bowlEmoji").innerText = "🥣";
            currentDialogue = "السَّلَامُ عَلَيْكُمْ دوستو! نئی ریسیپی شروع کرتے ہیں، مَا شَاءَ اللّٰه!";
            document.getElementById("voiceText").innerText = currentDialogue;
            speak(currentDialogue, true);
        }

        // پیج کھلتے ہی گیم کا آغاز اور سلام
        window.onload = () => {
            setTimeout(() => {
                speak("السَّلَامُ عَلَيْكُمْ دوستو! آج مزیدار پین کیک بنے گا، مَا شَاءَ اللّٰه!", true);
            }, 1000);
        };
    </script>
</body>
</html>
