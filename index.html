<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ننھے شیف - لائیو کوکنگ سمولیشن گیم</title>
    <!-- Phaser 3 CDN سے لوڈ ہو رہا ہے تاکہ کوئی بلینک اسکرین یا انسٹالیشن کا مسئلہ نہ ہو -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        #game-container {
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        class KitchenScene extends Phaser.Scene {
            constructor() {
                super('KitchenScene');
            }

            create() {
                // کچن کا لائیو پس منظر
                this.add.rectangle(640, 360, 1280, 720, 0x34495e);
                
                // ہیڈر اور ٹائتل
                this.add.text(640, 50, '🍳 ننھے شیف - لائیو کچن سمولیشن 🍲', {
                    fontSize: '42px',
                    fill: '#f1c40f',
                    fontStyle: 'bold'
                }).setOrigin(0.5);

                // وائس اوور ڈائیلاگ باکس
                this.add.rectangle(640, 140, 900, 70, 0xffffff, 0.9).setRadius(20);
                
                this.instructionText = this.add.text(640, 140, 'السَّلَامُ عَلَيْكُمْ دوستو! آج ہمارے کچن میں مزیدار پین کیک بنے گا، مَا شَاءَ اللّٰه!', {
                    fontSize: '24px',
                    fill: '#2c3e50',
                    fontStyle: 'bold'
                }).setOrigin(0.5);

                // عربی ایکسنٹ میں سلام
                this.playArabicVoice("السَّلَامُ عَلَيْكُمْ دوستو! آج ہمارے کچن میں مزیدار پین کیک بنے گا، مَا شَاءَ اللّٰه!");

                // مکسنگ باؤل اور چولہا
                let bowl = this.add.text(400, 480, '🥣', { fontSize: '90px' }).setOrigin(0.5).setInteractive();
                this.add.text(400, 560, 'مکسنگ پیالہ', { fontSize: '20px', fill: '#fff' }).setOrigin(0.5);

                let stove = this.add.text(880, 480, '🔥', { fontSize: '90px' }).setOrigin(0.5).setInteractive();
                this.add.text(880, 560, 'چولہا (Stove)', { fontSize: '20px', fill: '#fff' }).setOrigin(0.5);

                // اجزاء کی ٹرے (میدہ، انڈا، دودھ، شہد)
                let flour = this.add.text(250, 280, '🌾', { fontSize: '60px' }).setOrigin(0.5).setInteractive();
                let egg = this.add.text(450, 280, '🥚', { fontSize: '60px' }).setOrigin(0.5).setInteractive();
                let milk = this.add.text(650, 280, '🥛', { fontSize: '60px' }).setOrigin(0.5).setInteractive();
                let honey = this.add.text(850, 280, '🍯', { fontSize: '60px' }).setOrigin(0.5).setInteractive();

                // ڈریگ اینڈ ڈراپ ایونٹس
                this.input.setDraggable([flour, egg, milk, honey]);

                this.input.on('drag', (pointer, gameObject, dragX, dragY) => {
                    gameObject.x = dragX;
                    gameObject.y = dragY;
                });

                this.input.on('dragend', (pointer, gameObject, dropped) => {
                    let distance = Phaser.Math.Distance.Between(gameObject.x, gameObject.y, bowl.x, bowl.y);
                    if (distance < 120) {
                        gameObject.destroy();
                        this.playVoice("بہت اچھے! مکسچر میں شامل ہو گیا ہے۔");
                        this.instructionText.setText('شاباش! اب ہینڈ وسک سے مکس کریں اور چولہے پر پکائیں۔');
                    } else {
                        // واپس اپنی جگہ پر لوٹا دیں
                        gameObject.x = gameObject.input.dragStartX;
                        gameObject.y = gameObject.input.dragStartY;
                    }
                });
            }

            playArabicVoice(text) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    let utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ar-SA'; // خالص عربی لہجہ سلام اور ماشاءاللہ کے لیے
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                }
            }

            playVoice(text) {
                if ('speechSynthesis' in window) {
                    let utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ur-PK'; // عام ہدایات اردو میں
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                }
            }
        }

        const config = {
            type: Phaser.AUTO,
            width: 1280,
            height: 720,
            parent: 'game-container',
            backgroundColor: '#2c3e50',
            scene: [KitchenScene]
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
